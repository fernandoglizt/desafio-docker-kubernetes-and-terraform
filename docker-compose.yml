services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mural
      POSTGRES_DB: mural
      POSTGRES_PASSWORD: ${MURAL_DB_PASSWORD:?defina MURAL_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, mural, -d, mural]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${MURAL_DB_PASSWORD:?defina MURAL_DB_PASSWORD}
    volumes:
      - ./app/api/migrations:/migrations:ro
    entrypoint: [sh, -ec]
    command:
      - |
        set --
        for file in /migrations/*.sql; do
          set -- "$$@" -f "$$file"
        done
        psql -h db -U mural -d mural -v ON_ERROR_STOP=1 --single-transaction "$$@"

  api:
    image: golang:1.23-alpine
    working_dir: /src
    volumes:
      - ./app/api:/src:ro
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://mural:${MURAL_DB_PASSWORD:?defina MURAL_DB_PASSWORD}@db:5432/mural?sslmode=disable
    command: [go, run, .]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 12

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./app/web:/usr/share/nginx/html:ro
      - ./app/web/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "127.0.0.1:${MURAL_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
