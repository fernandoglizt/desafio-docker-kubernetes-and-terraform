apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "mural.labels" . | nindent 4 }}
data:
  PORT: "8080"
  API_UPSTREAM: {{ printf "%s-api:80" .Release.Name | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
