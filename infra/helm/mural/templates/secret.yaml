{{- $password := required "defina postgres.password" .Values.postgres.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" (urlquery .Values.postgres.user) (urlquery $password) .Release.Name (urlquery .Values.postgres.database) | quote }}
