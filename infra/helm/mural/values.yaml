chartRevision: dev

api:
  replicas: 2
  image:
    repository: local/mural-api
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 30m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }

web:
  replicas: 2
  image:
    repository: local/mural-web
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 20m, memory: 16Mi }
    limits: { cpu: 150m, memory: 64Mi }

postgres:
  image: postgres:16-alpine
  database: mural
  user: mural
  password: ""
  storage: 1Gi
  resources:
    requests: { cpu: 80m, memory: 96Mi }
    limits: { cpu: 400m, memory: 256Mi }

migration:
  resources:
    requests: { cpu: 20m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

ingress:
  className: traefik
  host: mural.localtest.me
  entryPoint: web
